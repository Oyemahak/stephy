<style>
  .abh-custom-header,
  .abh-custom-header * {
    box-sizing: border-box;
  }

  .abh-custom-header {
    --abh-bg: #fff;
    --abh-text: #112127;
    --abh-accent: #f2a116;
    --abh-dark: #0c1b20;
    --abh-border: rgba(17, 33, 39, 0.08);
    --abh-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
    width: 100%;
    position: relative;
    z-index: 999;
    font-family: Arial, sans-serif;
  }

  .abh-custom-header .abh-header-shell {
    width: min(12000px, calc(100% - 40px));
    margin: 0 auto;
    background: var(--abh-bg);
    border-radius: 8px;
    box-shadow: var(--abh-shadow);
    border: 1px solid var(--abh-border);
    padding: 16px;
  }

  .abh-custom-header .abh-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }

  .abh-custom-header .abh-logo {
    flex: 0 0 auto;
    min-width: 170px;
  }

  .abh-custom-header .abh-logo a {
    text-decoration: none;
    color: var(--abh-text);
    display: inline-block;
    font-family: Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.02;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }

  .abh-custom-header .abh-logo a:hover {
    color: var(--abh-accent);
  }

  .abh-custom-header .abh-desktop-nav {
    flex: 1 1 auto;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 34px;
  }

  .abh-custom-header .abh-desktop-nav a,
  .abh-custom-header .abh-mobile-panel a {
    text-decoration: none;
    color: var(--abh-text);
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: 0.25s ease;
  }

  .abh-custom-header .abh-desktop-nav a:hover,
  .abh-custom-header .abh-desktop-nav a.abh-active,
  .abh-custom-header .abh-mobile-panel a:hover,
  .abh-custom-header .abh-mobile-panel a.abh-active {
    color: var(--abh-accent);
  }

  .abh-custom-header .abh-right-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 0 0 auto;
  }

  .abh-custom-header .abh-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    background: var(--abh-accent);
    color: #fff;
    min-height: 52px;
    padding: 0 28px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: 0.25s ease;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }

  .abh-custom-header .abh-btn:hover {
    transform: translateY(-2px);
    opacity: 0.95;
  }

  .abh-custom-header .abh-menu-toggle {
    display: none;
    width: 48px;
    height: 48px;
    border: 1px solid rgba(17, 33, 39, 0.12);
    background: #fff;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .abh-custom-header .abh-menu-toggle span {
    position: absolute;
    width: 22px;
    height: 2px;
    background: var(--abh-text);
    border-radius: 3px;
    transition: 0.25s ease;
  }

  .abh-custom-header .abh-menu-toggle span:nth-child(1) {
    transform: translateY(-7px);
  }

  .abh-custom-header .abh-menu-toggle span:nth-child(2) {
    transform: translateY(0);
  }

  .abh-custom-header .abh-menu-toggle span:nth-child(3) {
    transform: translateY(7px);
  }

  .abh-custom-header .abh-menu-toggle.active span:nth-child(1) {
    transform: rotate(45deg);
  }

  .abh-custom-header .abh-menu-toggle.active span:nth-child(2) {
    opacity: 0;
  }

  .abh-custom-header .abh-menu-toggle.active span:nth-child(3) {
    transform: rotate(-45deg);
  }

  .abh-custom-header .abh-mobile-panel {
    display: none;
    padding-top: 18px;
    margin-top: 18px;
    border-top: 1px solid rgba(17, 33, 39, 0.08);
    flex-direction: column;
    gap: 14px;
  }

  .abh-custom-header .abh-mobile-panel a {
    padding: 6px 0;
  }

  .abh-custom-header .abh-mobile-btn {
    margin-top: 8px;
    width: 100%;
    text-align: center;
  }

  .abh-custom-header .abh-mobile-panel.open {
    display: flex;
  }

  @media (max-width: 1024px) {
    .abh-custom-header .abh-header-shell {
      width: min(100%, calc(100% - 24px));
      padding: 18px 18px;
    }

    .abh-custom-header .abh-desktop-nav,
    .abh-custom-header .abh-right-actions .abh-btn {
      display: none;
    }

    .abh-custom-header .abh-menu-toggle {
      display: inline-flex;
    }

    .abh-custom-header .abh-logo a {
      font-size: 18px;
    }
  }

  @media (max-width: 767px) {
    .abh-custom-header {
      padding: 18px 0;
    }

    .abh-custom-header .abh-header-shell {
      border-radius: 6px;
      padding: 16px 16px;
    }

    .abh-custom-header .abh-header-row {
      gap: 14px;
    }

    .abh-custom-header .abh-logo {
      min-width: 0;
      max-width: calc(100% - 64px);
    }

    .abh-custom-header .abh-logo a {
      font-size: 16px;
      line-height: 1.05;
    }

    .abh-custom-header .abh-menu-toggle {
      width: 44px;
      height: 44px;
    }
  }
</style>

<header class="abh-custom-header">
  <div class="abh-header-shell">
    <div class="abh-header-row">
      <div class="abh-logo">
        <a href="/">
          ANJANEY’S BIRIYANI<br>HOUSE
        </a>
      </div>

      <nav class="abh-desktop-nav" aria-label="Main navigation">
        <a href="/" class="abh-active">Home</a>
        <a href="/about">About</a>
        <a href="/menu">Menu</a>
        <a href="/blog">Blog</a>
        <a href="/contact">Contact</a>
      </nav>

      <div class="abh-right-actions">
        <a href="/reservations" class="abh-btn">Book a Table</a>

        <button class="abh-menu-toggle" aria-label="Open menu" aria-expanded="false" type="button">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    <div class="abh-mobile-panel" aria-label="Mobile navigation">
      <a href="/" class="abh-active">Home</a>
      <a href="/about">About</a>
      <a href="/menu">Menu</a>
      <a href="/blog">Blog</a>
      <a href="/contact">Contact</a>
      <a href="/reservations" class="abh-btn abh-mobile-btn">Book a Table</a>
    </div>
  </div>
</header>

<script>
  (function () {
    const header = document.currentScript.previousElementSibling;
    if (!header) return;

    const toggle = header.querySelector('.abh-menu-toggle');
    const mobilePanel = header.querySelector('.abh-mobile-panel');

    if (!toggle || !mobilePanel) return;

    toggle.addEventListener('click', function () {
      const isOpen = mobilePanel.classList.toggle('open');
      toggle.classList.toggle('active', isOpen);
      toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
    });

    const mobileLinks = mobilePanel.querySelectorAll('a');
    mobileLinks.forEach(function (link) {
      link.addEventListener('click', function () {
        mobilePanel.classList.remove('open');
        toggle.classList.remove('active');
        toggle.setAttribute('aria-expanded', 'false');
      });
    });
  })();
</script>
